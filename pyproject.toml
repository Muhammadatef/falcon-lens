[project]
name = "falcon-lens"
version = "0.1.0"
license = "Apache-2.0"
description = "Falcon Lens | عدسة الصقر — workspace root"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/falcon_core",
  "services/api",
  "services/worker",
  "services/sentinel",
  "services/mcp",
  "services/egress",
  "services/sandbox",
]

[tool.uv.sources]
falcon-core = { workspace = true }
falcon-api = { workspace = true }
falcon-worker = { workspace = true }
falcon-sentinel = { workspace = true }
falcon-mcp-service = { workspace = true }
falcon-egress = { workspace = true }
falcon-sandbox = { workspace = true }

[dependency-groups]
dev = [
  "falcon-core",
  "falcon-api",
  "falcon-worker",
  "falcon-sentinel",
  "falcon-mcp-service",
  "falcon-egress",
  "falcon-sandbox",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-jsonschema",
  "types-PyYAML",
  "fakeredis>=2.26",
  "pyyaml>=6",
  "pytest-cov>=6",
  "scikit-learn>=1.9.1",
  "joblib>=1.6.0",
  "numpy>=2.5.5",
  "qrcode>=8",
]

# Offline prompt optimisation only (ADR-002). NOT a runtime dependency: production never imports dspy.
dspy = ["dspy[optuna]==3.5.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", ".venv", "docs", "*.md"]  # ruff 0.17 would reformat code blocks in docs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PLE2502", "PLE2515"]
ignore = ["S104", "SIM905", "UP047"]  # S104: services bind 0.0.0.0 in containers; SIM905: `"a b".split()` word lists are deliberate

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "scoring_helpers"]
known-first-party = [
  "falcon_core", "falcon_api", "falcon_worker", "falcon_sentinel",
  "falcon_mcp", "falcon_egress", "falcon_sandbox",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S324", "E501"]
"evals/**" = ["S603", "S607"]
"evals/dspy/*.py" = ["E501", "E402", "S101", "S311"]  # flat modules; optimize.py sets sys.path before importing
"**/fixtures.py" = ["S311"]
"scripts/falcon_demo/**" = ["S311", "S603", "S607"]
"services/sentinel/**" = ["E501"]  # bilingual strings and SQL read better unwrapped
"infra/grafana/gen_dashboards.py" = ["E501"]  # long bilingual descriptions read better unwrapped
"packages/falcon_core/src/falcon_core/tools/**" = ["E501"]
"services/sentinel/sentinel_core/**" = ["S311", "S324", "UP047"]
"scripts/smoke.py" = ["S101", "S501"]
# Seeded sampling and bootstrap statistics: reproducibility matters, not cryptographic strength.
"scripts/fp_regress.py" = ["S311"]
"evals/datasets/build_heldout_legit.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Strict applies to falcon_core itself (CLAUDE.md). Tests are linted by ruff but not type-checked:
# several test dirs ship a `conftest.py` and mypy reports them as duplicate modules.
files = ["packages/falcon_core/src", "services/api/src", "services/worker/src", "services/mcp/src"]
explicit_package_bases = true
mypy_path = "packages/falcon_core/src:services/api/src:services/worker/src:services/mcp/src"

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*"]
ignore_missing_imports = true  # joblib ships no stubs; used only by the T1 model loader

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/falcon_core/tests", "services", "scripts/tests", "scripts/falcon_demo", "evals"]
pythonpath = ["scripts", "."]
markers = ["integration: needs the compose stack (FL_INTEGRATION=1) or a real Postgres (FL_TEST_PG_DSN)"]
