name: Task
description: A unit of work (feature, chore or doc)
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable bullets, including the tests that prove it.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      description: Used for the branch name feat/<module>-<slug>, e.g. signals, api, web.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Contracts touched, risks, links.
