name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: make test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --no-banner .
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace --no-hashes -o requirements.audit.txt
          uvx pip-audit -r requirements.audit.txt --no-deps --disable-pip
      - name: trivy fs
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: web/node_modules

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile core --profile obs --profile tools config -q

  eval-gate:
    # TODO(builder-evals): placeholder. Replace with `make eval` + the merge-gate tolerances from
    # docs/EVALS.md once the harness exists. This job intentionally does NOT gate anything yet.
    runs-on: ubuntu-24.04
    steps:
      - run: echo "TODO eval gate not implemented yet; see docs/EVALS.md"
