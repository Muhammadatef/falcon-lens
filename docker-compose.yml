name: falcon

# Profiles: core (product), obs (observability), tools (fixtures), stretch (reserved).
# `make up` starts core + obs. All image tags are pinned; every image used is multi-arch
# (amd64 + arm64), so the same file runs on Apple Silicon and x86-64 Linux.

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-app-env: &app-env
  FL_ENV: ${FL_ENV:?FL_ENV must be set (local|demo|ci|production)}
  FL_SOVEREIGN_MODE: ${FL_SOVEREIGN_MODE:-false}
  FL_PUBLIC_BASE_URL: ${FL_PUBLIC_BASE_URL:-https://localhost:8443}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FL_CLOUD_MODEL_INVESTIGATOR: ${FL_CLOUD_MODEL_INVESTIGATOR:-claude-sonnet-5-5}
  FL_CLOUD_MODEL_VISION: ${FL_CLOUD_MODEL_VISION:-claude-sonnet-5-5}
  FL_CLOUD_MODEL_EXTRACTOR: ${FL_CLOUD_MODEL_EXTRACTOR:-claude-haiku-5-5}
  FL_CLOUD_MODEL_RESPONDER: ${FL_CLOUD_MODEL_RESPONDER:-claude-haiku-5-5}
  FL_LLM_TIMEOUT_S: ${FL_LLM_TIMEOUT_S:-12}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  FL_LOCAL_MODEL: ${FL_LOCAL_MODEL:-inkling-2-mini-chat}
  FL_LOCAL_VISION_MODEL: ${FL_LOCAL_VISION_MODEL:-gemma3:27b}
  FL_EMBED_MODEL: ${FL_EMBED_MODEL:-qwen3-embedding:4b}
  FL_EMBED_DIM: ${FL_EMBED_DIM:-2560}
  GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
  URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
  FL_FEED_OPENPHISH_ENABLED: ${FL_FEED_OPENPHISH_ENABLED:-true}
  DATABASE_URL: postgresql://${POSTGRES_USER:-falcon}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-falcon}
  REDIS_URL: redis://redis:6379/0
  FL_API_KEY_PEPPER: ${FL_API_KEY_PEPPER:-change-me}
  FL_SANDBOX_API_KEY: ${FL_SANDBOX_API_KEY:-fl_sandbox_demo_key}
  FL_SANDBOX_URL: ${FL_SANDBOX_URL:-http://sandbox:8000}
  # Demo/test fixture hosts exempt from the SSRF internal-name check. Honoured only when FL_ENV is local, demo or ci.
  FL_SSRF_ALLOW_HOSTS: ${FL_SSRF_ALLOW_HOSTS:-fixtures,falcon-demo-bank.test,falcon-demo-bank-secure.test,falcon-demo-bank-login.test}
  FL_SMOKE_OFFICIAL_URL: ${FL_SMOKE_OFFICIAL_URL:-http://falcon-demo-bank.test/}
  FL_SMOKE_PHISH_URL: ${FL_SMOKE_PHISH_URL:-http://falcon-demo-bank-secure.test/login}
  FL_SANDBOX_TOKEN: ${FL_SANDBOX_TOKEN:-change-me-sandbox}
  FALCON_BRANDS_YAML: /app/data/brands.yaml
  FL_REPORTING_CHANNELS: /app/config/reporting_channels.yaml
  FL_OPERATOR_KEY: ${FL_OPERATOR_KEY:-change-me-operator}
  FL_MCP_BEARER_TOKEN: ${FL_MCP_BEARER_TOKEN:-change-me-mcp}
  FL_WEBHOOK_SECRET: ${FL_WEBHOOK_SECRET:-change-me-webhook}
  FL_WEBHOOK_TARGETS: ${FL_WEBHOOK_TARGETS:-}
  FL_MCP_SERVICE_KEY: ${FL_MCP_SERVICE_KEY:-change-me-mcp-service}
  FL_SENTINEL_URL: ${FL_SENTINEL_URL:-http://sentinel:8000}
  FL_API_URL: ${FL_API_URL:-http://api:8000}
  FL_RATE_LIMIT_PER_IP_PER_MIN: ${FL_RATE_LIMIT_PER_IP_PER_MIN:-60}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}

x-host-gateway: &host-gateway
  extra_hosts:
    - "host.docker.internal:host-gateway"

networks:
  edge: {}
  app: {}
  data:
    internal: true
  # Only sandbox + egress-proxy (+ the tools-profile fixtures) live here. No route to the internet.
  sandbox:
    internal: true
  # Control channel worker <-> sandbox. Internal, so the sandbox still has no way out. The worker
  # exposes only health + metrics here and the sandbox API needs FL_SANDBOX_TOKEN.
  sandbox_ctl:
    internal: true
  # Internal: metrics/log/trace plumbing never reaches the internet. Grafana/Prometheus also join
  # `edge` so their loopback host ports can be published.
  observability:
    internal: true

volumes:
  pg_data: {}
  redis_data: {}
  prom_data: {}
  alertmanager_data: {}
  loki_data: {}
  grafana_data: {}
  alloy_data: {}

services:
  # ───────────────────────────── core ─────────────────────────────
  gateway:
    profiles: [core]
    image: caddy:2.11.9-alpine
    <<: *hardened
    user: "65532:65532"
    ports:
      - "127.0.0.1:${FL_GATEWAY_PORT:-8443}:8443"
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /tmp
      - /data:uid=65532,gid=65532,mode=0700
      - /config:uid=65532,gid=65532,mode=0700
    networks: [edge, app, observability]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      mcp: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  api:
    profiles: [core]
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: falcon-lens/api:0.1.0
    <<: [*hardened, *host-gateway]
    environment: *app-env
    networks: [app, data, observability]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m
    cpus: 1
    pids_limit: 256

  worker:
    profiles: [core]
    build: { context: ., dockerfile: services/worker/Dockerfile }
    image: falcon-lens/worker:0.1.0
    <<: [*hardened, *host-gateway]
    environment:
      <<: *app-env
      # Stable consumer name in the fl:jobs group (XAUTOCLAIM reclaims idle entries either way).
      FL_WORKER_ID: ${FL_WORKER_ID:-worker-1}
      # Network signals (RDAP, crt.sh, GSB, URLhaus) go through the filtering egress proxy.
      # FL_SANDBOX_URL / FL_SANDBOX_TOKEN / FL_SSRF_ALLOW_HOSTS come from x-app-env (allow-list honoured
      # only when FL_ENV is local, demo or ci, same rule as the sandbox).
      FL_EGRESS_PROXY: ${FL_EGRESS_PROXY:-http://egress-proxy:3128}
      FL_OPENPHISH_FEED_DIR: /app/data/private/feeds/openphish
      # AI parts: quarantined extractor (T2), investigator (T3), responder; fitted T1 classifier for p_clf.
      # Each fails soft to the deterministic cascade; set false to run offline / for evals.
      FL_AI_ENABLED: ${FL_AI_ENABLED:-true}
      FL_T1_MODEL_ENABLED: ${FL_T1_MODEL_ENABLED:-true}
    volumes:
      # Private OpenPhish rows (gitignored). The worker's refresh job loads them into the hash-only
      # Redis mirror every FL_OPENPHISH_REFRESH_S. Missing dir = mirror unavailable (degraded checks).
      - ${FL_OPENPHISH_HOST_DIR:-./data/private/feeds/openphish}:/app/data/private/feeds/openphish:ro
    networks: [app, data, sandbox_ctl, observability]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      sandbox: { condition: service_healthy }
    mem_limit: 768m
    cpus: 2
    pids_limit: 256

  sandbox:
    profiles: [core]
    build: { context: ., dockerfile: services/sandbox/Dockerfile }
    image: falcon-lens/sandbox:0.1.0
    <<: *hardened
    environment:
      FL_ENV: ${FL_ENV:?FL_ENV must be set (local|demo|ci|production)}
      FL_SANDBOX_TOKEN: ${FL_SANDBOX_TOKEN:-change-me-sandbox}
      # All outbound traffic must go through the filtering proxy.
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1
      FL_SANDBOX_PROXY: http://egress-proxy:3128
      FL_SNAPSHOT_DIR: /data/snapshots
      # Internal Falcon Demo Bank fixture hosts (tools profile): bypass the proxy and are exempt from
      # the internal-name check; honoured only when FL_ENV is local, demo or ci. Extra *.test hosts (cloaked, injection,
      # bot relay) are appended for the fixture tests.
      FL_SSRF_ALLOW_HOSTS: ${FL_SSRF_ALLOW_HOSTS:-fixtures,falcon-demo-bank.test,falcon-demo-bank-secure.test,falcon-demo-bank-login.test},falcon-demo-bank-cloak.test,falcon-demo-bank-injection.test,falcon-bot-relay.test
    volumes:
      - ./data/private/snapshots:/data/snapshots
    # No `observability` here: the sandbox must not reach Prometheus/Loki/Alertmanager/etc.
    # Metrics are relayed by the worker (/metrics/sandbox) over sandbox_ctl.
    networks: [sandbox, sandbox_ctl]
    shm_size: 512m
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    depends_on:
      egress-proxy: { condition: service_healthy }

  egress-proxy:
    profiles: [core]
    build: { context: ., dockerfile: services/egress/Dockerfile }
    image: falcon-lens/egress:0.1.0
    <<: *hardened
    environment:
      FL_ENV: ${FL_ENV:?FL_ENV must be set (local|demo|ci|production)}
      FL_EGRESS_ALLOW_HOSTS: ${FL_SSRF_ALLOW_HOSTS:-fixtures,falcon-demo-bank.test,falcon-demo-bank-secure.test,falcon-demo-bank-login.test}
    # `app` is the non-internal network that gives the proxy its route to the internet.
    networks: [sandbox, app, observability]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128

  postgres:
    profiles: [core]
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-falcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-falcon}
    volumes:
      # PG18 images keep the cluster under /var/lib/postgresql/<major>/docker.
      - pg_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 1g
    cpus: 1
    pids_limit: 256

  redis:
    profiles: [core]
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]  # the image entrypoint chowns /data, then drops to `redis`
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128

  web:
    profiles: [core]
    build: { context: ./web, dockerfile: Dockerfile }
    image: falcon-lens/web:0.1.0
    <<: *hardened
    environment:
      FL_PUBLIC_BASE_URL: ${FL_PUBLIC_BASE_URL:-https://localhost:8443}
    networks: [app]
    mem_limit: 384m
    cpus: 1
    pids_limit: 128

  mcp:
    profiles: [core]
    build: { context: ., dockerfile: services/mcp/Dockerfile }
    image: falcon-lens/mcp:0.1.0
    <<: *hardened
    environment: *app-env
    networks: [app, observability]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  sentinel:
    profiles: [core]
    build: { context: ., dockerfile: services/sentinel/Dockerfile }
    image: falcon-lens/sentinel:0.1.0
    <<: [*hardened, *host-gateway]
    restart: always
    environment:
      <<: *app-env
      ALERTMANAGER_URL: http://alertmanager:9093
      LANGSMITH_TRACING: "false"  # langsmith ships transitively with langgraph: never export incident data
      LANGCHAIN_TRACING_V2: "false"
    networks: [app, data, observability]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    mem_limit: 512m
    cpus: 1
    pids_limit: 256

  # ───────────────────────────── obs ──────────────────────────────
  otel-collector:
    profiles: [obs]
    build: { context: ./infra/otel, dockerfile: Dockerfile }
    image: falcon-lens/otel-collector:0.165.0
    <<: *hardened
    volumes:
      - ./infra/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    networks: [observability]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.16.0
    <<: *host-gateway
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    ports:
      - "127.0.0.1:${FL_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - ./infra/prometheus/demo:/etc/prometheus/demo:ro
      - prom_data:/prometheus
    networks: [observability, edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: 1
    pids_limit: 128

  alertmanager:
    profiles: [obs]
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    # The entrypoint renders the config: Telegram/webhook only if configured, else a null receiver.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./infra/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    networks: [observability]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  loki:
    profiles: [obs]
    build: { context: ./infra/loki, dockerfile: Dockerfile }
    image: falcon-lens/loki:3.7.10
    restart: unless-stopped
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [observability]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1
    pids_limit: 256

  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Root + read-only docker.sock is needed to tail container logs (obs profile only).
    user: "0:0"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]  # /var/lib/alloy is 0770 alloy:alloy; root needs this once caps are dropped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *200* ]]"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  grafana:
    profiles: [obs]
    image: grafana/grafana:13.2.6
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:${FL_GRAFANA_PORT:-3001}
    ports:
      - "127.0.0.1:${FL_GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [observability, edge]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1
    pids_limit: 256

  phoenix:
    profiles: [obs]
    image: arizephoenix/phoenix:version-22.0.1-nonroot
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    # Nonroot image (uid 65532) cannot write a root-owned named volume, so traces live in a
    # uid-owned tmpfs: they are lost on restart (acceptable for the demo; use Postgres later).
    tmpfs:
      - /mnt/data:uid=65532,gid=65532,mode=0700
    networks: [observability]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: 1
    pids_limit: 256

  # TEST DOUBLE, never part of `make up`. Only `FL_SMOKE_FAKE_WORKER=1 make smoke` starts it
  # (and stops the real worker first) to exercise API + SSE before the real cascade exists.
  fake-worker:
    profiles: [smoke-fake]
    image: falcon-lens/api:0.1.0
    <<: *hardened
    restart: "no"
    command: ["python", "-m", "falcon_api.fake_worker"]
    environment: *app-env
    healthcheck:
      disable: true
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # ───────────────────────────── tools ────────────────────────────
  # Falcon Demo Bank fixtures: invented brand only, internal `sandbox` network only, never published.
  # One nginx answers for every fixture host via network aliases (*.test never resolves outside Docker).
  fixtures:
    profiles: [tools]
    image: nginxinc/nginx-unprivileged:1.29-alpine
    <<: *hardened
    volumes:
      - ./services/fixtures/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/fixtures/conf/redirs.inc:/etc/nginx/conf.d/redirs.inc:ro
      - ./services/fixtures/sites:/srv:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
    networks:
      sandbox:
        aliases:
          - fixtures
          - falcon-demo-bank.test
          - falcon-demo-bank-secure.test
          - falcon-demo-bank-login.test
          - falcon-demo-bank-cloak.test
          - falcon-demo-bank-injection.test
          - falcon-bot-relay.test
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64

  # `stretch` profile is reserved for post-MVP services (none yet).
