</g>
</g>

<!-- 3 trigger -->
<g>
<rect class="card" x="608" y="110" width="276" height="330" rx="14"/>
<text x="624" y="136" class="h">Trigger</text>
<text x="624" y="156" class="m k" fill="#8794ae">rules.yaml · unit-tested</text>
<g>
<rect class="in" x="624" y="170" width="244" height="44" rx="8"/><rect class="glow onl" style="animation-delay:5.4s" x="624" y="170" width="244" height="44" rx="8"/>
<rect class="in" x="624" y="220" width="244" height="44" rx="8"/>
<rect class="in" x="624" y="270" width="244" height="44" rx="8"/>
<rect class="in" x="624" y="320" width="244" height="44" rx="8"/>
<rect class="in" x="624" y="370" width="244" height="44" rx="8"/>
<g class="m h tl" font-size="13"><text x="636" y="188">R1</text><text x="636" y="238">R2</text><text x="636" y="288">R3</text><text x="636" y="338">R4</text><text x="636" y="388">R5</text></g>
<g class="h" font-size="13.500"><text x="662" y="188">Campaign</text><text x="662" y="238">Kit reuse</text><text x="662" y="288">Report burst</text><text x="662" y="338">Reputation flip</text><text x="662" y="388">Quality</text></g>
<g class="c" font-size="12"><text x="636" y="205">3+ lookalikes of one brand in 60 min</text><text x="636" y="255">one dom_simhash on 3+ domains</text><text x="636" y="305">5+ reports on one script in 30 min</text><text x="636" y="355">was no warning signs, now dangerous</text><text x="636" y="405">5+ false-positive flags in 60 min</text></g>
</g>
<text x="868" y="136" text-anchor="end" class="m k am">incident.opened</text>
</g>

<!-- 4 triage -->
<g>
<rect class="card" x="900" y="110" width="276" height="330" rx="14"/>
<text x="916" y="136" class="h">Triage <tspan class="b" font-weight="400">· LangGraph StateGraph</tspan></text>
<text x="916" y="156" class="c">One thread per incident_id.</text>
<path class="w" d="M972 180V352"/>
<g>
<rect class="in" x="916" y="168" width="112" height="26" rx="13"/><rect class="glow on" style="animation-delay:6.6s" x="916" y="168" width="112" height="26" rx="13"/>
<rect class="in" x="916" y="202" width="112" height="26" rx="13"/><rect class="glow on" style="animation-delay:7.2s" x="916" y="202" width="112" height="26" rx="13"/>
<rect class="in" x="916" y="236" width="112" height="26" rx="13"/><rect class="glow on" style="animation-delay:7.8s" x="916" y="236" width="112" height="26" rx="13"/>
<rect class="in" x="916" y="270" width="112" height="26" rx="13"/><rect class="glow on" style="animation-delay:8.4s" x="916" y="270" width="112" height="26" rx="13"/>
<rect class="in" x="916" y="304" width="112" height="26" rx="13"/><rect class="glow on" style="animation-delay:9s" x="916" y="304" width="112" height="26" rx="13"/>
<rect class="in" x="916" y="338" width="112" height="26" rx="13"/><rect class="glow on" style="animation-delay:9.6s" x="916" y="338" width="112" height="26" rx="13"/>
<g class="h" font-size="13" text-anchor="middle"><text x="972" y="185.500">enrich</text><text x="972" y="219.500">compare</text><text x="972" y="253.500">assess</text><text x="972" y="287.500">summarise</text><text x="972" y="321.500">propose</text><text x="972" y="355.500">act</text></g>
</g>
<g class="m k">
<text x="1044" y="180" class="tag">STATE</text><text x="1044" y="198">Postgres</text><text x="1044" y="214">checkpointer</text>
<text x="1044" y="246" class="tag">RETRIES</text><text x="1044" y="264">per node</text>
<text x="1044" y="296" class="tag">BUDGET</text><text x="1044" y="314">8 steps</text><text x="1044" y="330">20k tokens</text><text x="1044" y="346">60 s</text>
</g>
<text x="916" y="390" class="c">The agent only enriches: severity reason,</text>
<text x="916" y="407" class="c">summary, proposed actions. It cannot</text>
<text x="916" y="424" class="c">edit rules, thresholds or scoring.</text>
</g>

<!-- 5a internal -->
<g>
<rect class="card" x="24" y="486" width="536" height="208" rx="14"/>
<text x="40" y="512" class="h">Internal actions run automatically</text><text x="544" y="512" text-anchor="end" class="m k tl">internal_auto</text>
<g>
<rect class="in" x="40" y="528" width="140" height="28" rx="14"/><rect class="in" x="188" y="528" width="112" height="28" rx="14"/><rect class="in" x="308" y="528" width="182" height="28" rx="14"/>
<rect class="in" x="40" y="564" width="112" height="28" rx="14"/><rect class="in" x="160" y="564" width="126" height="28" rx="14"/><rect class="in" x="294" y="564" width="140" height="28" rx="14"/>
<circle class="dot done" style="animation-delay:11.4s" cx="55" cy="542" r="5"/><circle class="dot done" style="animation-delay:11.8s" cx="203" cy="542" r="5"/><circle class="dot done" style="animation-delay:12.2s" cx="323" cy="542" r="5"/>
<circle class="dot done" style="animation-delay:12.6s" cx="55" cy="578" r="5"/><circle class="dot" cx="175" cy="578" r="5"/><circle class="dot done" style="animation-delay:11.4s" cx="309" cy="578" r="5"/>
<g class="m k"><text x="67" y="546">block_indicator</text><text x="215" y="546">raise_alert</text><text x="335" y="546">update_campaign_board</text><text x="67" y="582">export_stix</text><text x="187" y="582">requeue_check</text><text x="321" y="582">upsert_incident</text></g>
</g>
<text x="40" y="620" class="c">Every block carries a TTL and can be reverted:</text>
<text x="40" y="638" class="m k">make unblock ID=&lt;action_id&gt;</text>
<text x="40" y="662" class="c">Rules and correlation decide what an incident is.</text>
<text x="40" y="679" class="c">Incident counts reproduce with the LLM stubbed.</text>
</g>

<!-- 5b external -->
<g>
<rect class="card" x="576" y="486" width="600" height="208" rx="14"/>
<text x="592" y="512" class="h">External actions stop at a human</text><text x="1160" y="512" text-anchor="end" class="m k am">external_draft</text>
<g class="w" marker-end="url(#a)"><path d="M762 546H780V563H796"/><path d="M806 563H826"/><path d="M966 563H990"/><path d="M1026 563H1042V544H1056"/><path d="M1042 563V582H1056"/></g>
