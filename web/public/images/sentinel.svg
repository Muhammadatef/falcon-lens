<rect class="in" x="592" y="532" width="170" height="28" rx="14"/><rect class="glow am on" style="animation-delay:11.4s" x="592" y="532" width="170" height="28" rx="14"/>
<rect class="in" x="592" y="566" width="170" height="28" rx="14"/>
<g class="m k"><text x="606" y="550">draft_takedown</text><text x="606" y="584">draft_police_report</text></g>
<rect x="796" y="526" width="10" height="74" rx="5" fill="#f4b23a"/>
<rect class="glow am onl" style="animation-delay:12.3s" x="792" y="522" width="18" height="82" rx="8"/>
<text x="801" y="618" text-anchor="middle" class="m k am">interrupt()</text>
<rect x="826" y="549" width="140" height="28" rx="14" fill="#2a1d07" stroke="#8a6416"/><rect class="glow am wait" style="animation-delay:12.4s" x="826" y="549" width="140" height="28" rx="14"/>
<text x="896" y="567" text-anchor="middle" class="m k am">awaiting_approval</text>
<circle cx="1008" cy="563" r="18" fill="#16203a" stroke="#5a6c92" stroke-width="1.3"/><circle class="glow on" style="animation-delay:15.2s" cx="1008" cy="563" r="18"/>
<circle cx="1008" cy="557" r="5" fill="#e7d7b6"/><path d="M998 573q10-12 20 0" fill="none" stroke="#e7d7b6" stroke-width="2.4" stroke-linecap="round"/>
<text x="1008" y="602" text-anchor="middle" class="c">operator</text>
<rect x="1056" y="532" width="104" height="24" rx="12" fill="#04211d" stroke="#3fe0c5" stroke-opacity=".6"/><rect class="glow onl" style="animation-delay:15.8s" x="1056" y="532" width="104" height="24" rx="12"/>
<rect class="in" x="1056" y="570" width="104" height="24" rx="12"/>
<g class="m k" text-anchor="middle"><text x="1108" y="548" class="tl">approved</text><text x="1108" y="586">rejected</text></g>
<text x="592" y="646" class="c">The Sentinel writes the draft in Arabic and English. It never sends it.</text>
<text x="592" y="663" class="c">The graph resumes from its checkpoint when the operator decides.</text>
</g>

<!-- audit -->
<g>
<rect x="24" y="710" width="1152" height="42" rx="12" fill="#111c3d" stroke="#34488c" stroke-width="1.2"/>
<text x="40" y="736" class="m k bl" fill="#a9c0ff">audit_log</text>
<text x="118" y="736" class="b">Append-only. UPDATE and DELETE are revoked from the app role. Every action is stored with the evidence ids behind it.</text>
</g>

