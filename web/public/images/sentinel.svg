<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 776" width="1200" height="776" role="img" aria-labelledby="t d">
<title id="t">The Sentinel (Dir' | درع): the always-on backend agent</title>
<desc id="d">The Sentinel listens to platform events on a Redis stream, correlates them with deterministic code, and applies rules R1 to R5 to open incidents. A LangGraph state graph then triages each incident through the nodes enrich, compare, assess, summarise, propose and act. Internal actions such as blocking an indicator run automatically and are reversible. External actions such as a takedown draft stop at an interrupt and wait for a human operator to approve or reject them. Every action is written to an append-only audit log.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#f2eee6}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t1{font-size:22px;font-weight:600}
.h{font-size:14.5px;font-weight:600}
.b{font-size:13px;fill:#aeb8cc}
.c{font-size:12.5px;fill:#8794ae}
.k{font-size:11.5px;fill:#aeb8cc}
.tag{font-size:11.5px;fill:#8794ae;letter-spacing:.08em}
.tl{fill:#3fe0c5}.sd{fill:#e7d7b6}.am{fill:#ffc55c}
.card{fill:#0e1626;stroke:#2a3757;stroke-width:1.2}
.in{fill:#16203a;stroke:#2a3757}
.w{fill:none;stroke:#3a4a70;stroke-width:1.5}
.f{fill:none;stroke:#3fe0c5;stroke-width:1.5;stroke-dasharray:2 10;stroke-linecap:round;opacity:.55;animation:dash 1.6s linear infinite}
.glow{fill:#3fe0c5;fill-opacity:.1;stroke:#3fe0c5;stroke-width:1.8;opacity:0}
.glow.am{fill:#ffc55c;stroke:#ffc55c}
.dot{fill:#16203a;stroke:#5a6c92;stroke-width:1.3}
.pt{fill:#5a6c92}
.pk{opacity:0;offset-rotate:0deg}
.pk circle:first-child{opacity:.22}
.on{animation:lit 18s linear infinite}
.onl{animation:litl 18s linear infinite}
.done{animation:done 18s linear infinite}
.wait{animation:wait 18s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 18s ease-out infinite}
.pk.s{animation:go 18s cubic-bezier(.65,0,.35,1) infinite}
.pk.l{animation:gol 18s cubic-bezier(.65,0,.35,1) infinite}
.sweep{transform-origin:46px 42px;animation:spin 9s linear infinite}
.radar{transform-origin:454px 236px;animation:spin 7s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lit{0%,13%,100%{opacity:0}1.5%,9%{opacity:1}}
@keyframes litl{0%,26%,100%{opacity:0}1.5%,22%{opacity:1}}
@keyframes done{0%,34%,100%{fill:#16203a;stroke:#5a6c92}1.5%,30%{fill:#3fe0c5;stroke:#7df0dc}}
@keyframes wait{0%,18%,100%{opacity:0}1%,4%,8%,12%,16%{opacity:1}2.5%,6%,10%,14%{opacity:.35}}
@keyframes ping{0%,100%{opacity:0;transform:scale(.4)}1%{opacity:.9;transform:scale(.4)}7%{opacity:0;transform:scale(2.6)}}
@keyframes go{0%{offset-distance:0%;opacity:0}.5%{opacity:1}3.6%{offset-distance:100%;opacity:1}4.2%,100%{offset-distance:100%;opacity:0}}
@keyframes gol{0%{offset-distance:0%;opacity:0}.5%{opacity:1}6.6%{offset-distance:100%;opacity:1}7.2%,100%{offset-distance:100%;opacity:0}}
@supports not (offset-path:path("M0 0H1")){.pk{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pk,.radar,.ping{display:none}}
</style>
<defs>
<pattern id="lat" width="48" height="48" patternUnits="userSpaceOnUse">
<path d="M24 4l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="none" stroke="#16203a" stroke-width="1"/>
</pattern>
<radialGradient id="halo" cx="50%" cy="0%" r="75%">
<stop offset="0" stop-color="#3fe0c5" stop-opacity=".1"/><stop offset="1" stop-color="#3fe0c5" stop-opacity="0"/>
</radialGradient>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 .8L7 4 0 7.2z" fill="#5a6c92"/>
</marker>
</defs>

<rect width="1200" height="776" rx="22" fill="#070b14"/>
<rect width="1200" height="776" rx="22" fill="url(#lat)" opacity=".55"/>
<rect width="1200" height="400" rx="22" fill="url(#halo)"/>

<!-- header -->
<g>
<circle cx="46" cy="42" r="17" fill="#0e1626" stroke="#3fe0c5" stroke-width="2.4"/>
<path class="sweep" d="M46 42L46 25A17 17 0 0 1 61.6 35.2z" fill="#3fe0c5" opacity=".22"/>
<circle cx="46" cy="42" r="6" fill="#3fe0c5"/>
<path d="M26 27q20-13 42 0" fill="none" stroke="#e7d7b6" stroke-width="2.6" stroke-linecap="round"/>
<path d="M36 58q-2 9-9 14" fill="none" stroke="#e7d7b6" stroke-width="3.2" stroke-linecap="round"/>
<text x="84" y="40" class="t1">Falcon Lens <tspan fill="#8794ae" font-weight="400">/</tspan> the Sentinel</text>
<text x="84" y="62" class="b">The always-on backend agent. It links single checks into incidents and campaigns, acts inside the system, and waits for a human before anything leaves it.</text>
<text x="1176" y="42" text-anchor="end" class="t1 sd">عدسة الصقر</text>
</g>

<g class="m tag">
<text x="24" y="100">1 · LISTEN</text><text x="316" y="100">2 · CORRELATE</text><text x="608" y="100">3 · TRIGGER</text><text x="900" y="100">4 · TRIAGE</text><text x="24" y="478">5 · ACT</text>
</g>

<!-- wires -->
<g class="w" marker-end="url(#a)">
<path d="M300 275H316"/><path d="M592 275H608"/><path d="M884 275H900"/>
<path d="M1038 440V462H292V486"/><path d="M876 462V486"/>
</g>
<g class="f"><path d="M1038 440V462H292V486"/><path d="M876 462V486"/></g>

<!-- 1 listen -->
<g>
<rect class="card" x="24" y="110" width="276" height="330" rx="14"/>
<text x="40" y="136" class="h">Redis Streams</text>
<text x="40" y="156" class="m k" fill="#8794ae">fl:events · consumer group sentinel</text>
<g>
<rect class="in" x="40" y="170" width="244" height="26" rx="8"/><rect class="glow on" x="40" y="170" width="244" height="26" rx="8"/>
<rect class="in" x="40" y="202" width="244" height="26" rx="8"/><rect class="glow on" style="animation-delay:.5s" x="40" y="202" width="244" height="26" rx="8"/>
<rect class="in" x="40" y="234" width="244" height="26" rx="8"/><rect class="glow on" style="animation-delay:1s" x="40" y="234" width="244" height="26" rx="8"/>
<rect class="in" x="40" y="266" width="244" height="26" rx="8"/><rect class="glow on" style="animation-delay:1.5s" x="40" y="266" width="244" height="26" rx="8"/>
<rect class="in" x="40" y="298" width="244" height="26" rx="8"/><rect class="glow on" style="animation-delay:2s" x="40" y="298" width="244" height="26" rx="8"/>
<g class="m k"><text x="52" y="187.500">verdict.created</text><text x="52" y="219.500">domain.observed</text><text x="52" y="251.500">report.submitted</text><text x="52" y="283.500">verdict.upgraded</text><text x="52" y="315.500">feedback.submitted</text></g>
<g class="m k" text-anchor="end" fill="#8794ae"><text x="274" y="187.500">live</text><text x="274" y="219.500">live</text><text x="274" y="251.500">live</text><text x="274" y="283.500" class="am">replay</text><text x="274" y="315.500">live</text></g>
</g>
<text x="40" y="352" class="c">At-least-once delivery. Handlers are</text>
<text x="40" y="369" class="c">idempotent on event_id.</text>
<text x="40" y="396" class="c">Three failed attempts move an event to</text>
<text x="40" y="414" class="m k" fill="#8794ae">fl:events:dlq</text>
</g>

<!-- 2 correlate -->
<g>
<rect class="card" x="316" y="110" width="276" height="330" rx="14"/><rect class="glow on" style="animation-delay:3s" x="316" y="110" width="276" height="330" rx="14" fill-opacity=".03"/>
<text x="332" y="136" class="h">Correlate</text>
<text x="332" y="156" class="c">Plain Python. Deterministic. No model.</text>
<rect x="332" y="170" width="244" height="132" rx="10" fill="#0a101d" stroke="#2a3757"/>
<circle cx="454" cy="236" r="30" fill="none" stroke="#16203a"/><circle cx="454" cy="236" r="56" fill="none" stroke="#16203a"/>
<path class="radar" d="M454 236L454 180A56 56 0 0 1 493.600 196.400z" fill="#3fe0c5" opacity=".08"/>
<g stroke="#3fe0c5" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 3"><path d="M410 222L392 244"/><path d="M392 244L420 258"/><path d="M420 258L410 222"/><path d="M410 222L436 236"/><path d="M436 236L420 258"/></g>
<circle cx="412" cy="240" r="34" fill="#3fe0c5" fill-opacity=".05" stroke="#3fe0c5" stroke-opacity=".6" stroke-dasharray="4 4"/>
