<g class="pt"><circle cx="512" cy="200" r="4"/><circle cx="536" cy="262" r="4"/><circle cx="500" cy="232" r="4"/><circle cx="552" cy="218" r="4"/><circle cx="356" cy="194" r="4"/></g>
<g fill="none" stroke="#3fe0c5" stroke-width="2"><circle class="ping" style="animation-delay:3.2s" cx="410" cy="222" r="6"/><circle class="ping" style="animation-delay:3.6s" cx="420" cy="258" r="6"/><circle class="ping" style="animation-delay:4s" cx="436" cy="236" r="6"/></g>
<text x="566" y="294" text-anchor="end" class="m k tl">one brand · one kit</text>
<g>
<rect class="in" x="332" y="314" width="92" height="22" rx="11"/><rect class="in" x="430" y="314" width="52" height="22" rx="11"/><rect class="in" x="488" y="314" width="40" height="22" rx="11"/>
