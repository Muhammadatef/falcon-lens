[project]
name = "falcon-voice-clips"
version = "0.1.0"
description = "Offline generator: pre-rendered Falcon voice clips (local TTS on Apple Silicon)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.13",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Amazon Polly (offline clip pre-generation only; credentials from the environment)
polly = ["boto3>=1.35"]
# heavy, Apple-Silicon only; not installed in CI
mlx = [
  "mlx-audio==0.6.3",
  "misaki[en]==0.9.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "types-PyYAML"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
