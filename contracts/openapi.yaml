          - pattern: ^[A-Za-z0-9_.:-]{1,64}$
            type: string
          - type: 'null'
          description: Script cluster id, if the client has one.
          title: Script Fingerprint
        text:
          anyOf:
          - type: string
          - type: 'null'
          description: The reported URL or message. Hashed on receipt; kept only if consent_store_text
            is true.
          title: Text
        verdict_id:
          anyOf:
          - pattern: ^vd_[0-9A-HJKMNP-TV-Z]{26}$
            type: string
          - type: 'null'
          description: Related verdict, if any.
          title: Verdict Id
      required:
      - kind
      title: ReportIn
      type: object
    TraceBudget:
      additionalProperties: false
      properties:
        elapsed_ms:
          minimum: 0.0
          title: Elapsed Ms
          type: integer
        steps_used:
          minimum: 0.0
          title: Steps Used
          type: integer
        tokens_used:
          minimum: 0.0
          title: Tokens Used
          type: integer
      required:
      - steps_used
      - tokens_used
      - elapsed_ms
      title: TraceBudget
      type: object
    TraceInterrupt:
      additionalProperties: false
      properties:
        action_id:
          title: Action Id
          type: string
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        decision:
          anyOf:
          - enum:
            - approved
            - rejected
            type: string
          - type: 'null'
          title: Decision
        pending_count:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Pending Count
        tool:
          title: Tool
          type: string
        waiting_since:
          title: Waiting Since
          type: string
      required:
      - action_id
      - tool
      - waiting_since
      title: TraceInterrupt
      type: object
    TraceLlm:
      additionalProperties: false
      properties:
        cost_usd:
          minimum: 0.0
          title: Cost Usd
          type: number
        fallback_template:
          title: Fallback Template
          type: boolean
        model:
          title: Model
          type: string
        repaired:
          title: Repaired
          type: boolean
        route:
          enum:
          - cloud
          - local
          - none
          title: Route
          type: string
        tokens_in:
          minimum: 0.0
          title: Tokens In
          type: integer
        tokens_out:
          minimum: 0.0
          title: Tokens Out
          type: integer
      required:
      - route
      - model
      - tokens_in
      - tokens_out
      - cost_usd
      - repaired
      - fallback_template
      title: TraceLlm
      type: object
    TraceRun:
      additionalProperties: false
      properties:
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        interrupt:
          anyOf:
          - $ref: '#/components/schemas/TraceInterrupt'
          - type: 'null'
        run_id:
          title: Run Id
          type: string
        started_at:
          title: Started At
          type: string
        status:
          enum:
          - running
          - interrupted
          - completed
          - failed
          title: Status
          type: string
        steps:
          items:
            $ref: '#/components/schemas/falcon_core__contracts__agent_trace__TraceStep'
          title: Steps
          type: array
      required:
      - run_id
      - started_at
      - finished_at
      - status
      - steps
      - interrupt
      title: TraceRun
      type: object
    TraceTool:
      additionalProperties: false
      properties:
        duration_ms:
          minimum: 0.0
          title: Duration Ms
          type: integer
        evidence_ids:
          items:
            type: string
          maxItems: 20
          title: Evidence Ids
          type: array
        mode:
          enum:
          - read
          - internal_auto
          - external_draft
          title: Mode
          type: string
        name:
          title: Name
          type: string
        origin:
          anyOf:
          - enum:
            - model
            - rule_fallback
            type: string
          - type: 'null'
          title: Origin
        status:
          enum:
          - ok
          - error
          title: Status
          type: string
      required:
      - name
      - mode
      - status
      - evidence_ids
      - duration_ms
      title: TraceTool
      type: object
    UrlCheck:
      properties:
        channel:
          anyOf:
          - enum:
            - web
            - extension
            - api
            - mcp
            - voice
            - hunt
            type: string
          - type: 'null'
          description: 'Optional: which client asks (web, extension, api, mcp, voice). Metadata for History,
            metrics and the Sentinel; it never changes the verdict. A repeated identical input answers
            from the cache with the first channel. `hunt` is reserved for the Sentinel hunt mode: accepted
            only from a key with the `hunt` scope (else 422).'
          title: Channel
        url:
          description: URL to check (max 4 KB). Never fetched by the API.
          minLength: 1
          title: Url
          type: string
      required:
      - url
      title: UrlCheck
      type: object
    Verdict:
      additionalProperties: false
      properties:
        actions:
          $ref: '#/components/schemas/Actions'
        calibrated_probability:
          maximum: 1.0
          minimum: 0.0
          title: Calibrated Probability
          type: number
        canonical_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Canonical Url
        channel:
          anyOf:
          - enum:
            - web
            - extension
            - api
            - mcp
            - voice
            - hunt
            type: string
          - type: 'null'
          title: Channel
        created_at:
          format: date-time
          title: Created At
          type: string
        degraded:
          title: Degraded
          type: boolean
        degraded_reasons:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Degraded Reasons
        evidence:
          items:
            $ref: '#/components/schemas/Evidence'
          title: Evidence
          type: array
        final:
          title: Final
          type: boolean
        impersonated_brand:
          anyOf:
          - $ref: '#/components/schemas/Brand'
          - type: 'null'
        input_fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Fingerprint
        input_type:
          enum:
          - url
          - message
          - email
          - image
          title: Input Type
          type: string
        latency_ms:
          minimum: 0.0
          title: Latency Ms
          type: integer
        model_route:
          enum:
          - cloud
          - local
          - none
          title: Model Route
          type: string
        reasons:
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 3
          title: Reasons
          type: array
        risk_score:
          maximum: 100.0
          minimum: 0.0
          title: Risk Score
          type: integer
        schema_version:
          const: '1.0'
          default: '1.0'
          title: Schema Version
          type: string
        screenshot_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Screenshot Url
        source:
          default: live
          enum:
          - live
          - replay
          - synthetic
          - fixture
          title: Source
          type: string
        tier_reached:
          enum:
          - T0
          - T1
          - T2
          - T3
          title: Tier Reached
          type: string
        trace:
          anyOf:
          - items:
              $ref: '#/components/schemas/falcon_core__contracts__verdict__TraceStep'
            type: array
          - type: 'null'
          title: Trace
        verdict:
          enum:
          - dangerous
          - suspicious
          - no_warning_signs
          title: Verdict
          type: string
        verdict_id:
          pattern: ^vd_[0-9A-HJKMNP-TV-Z]{26}$
          title: Verdict Id
          type: string
      required:
      - verdict_id
      - input_type
      - verdict
      - risk_score
      - calibrated_probability
      - evidence
      - reasons
      - actions
      - tier_reached
      - model_route
      - degraded
      - final
      - latency_ms
      - created_at
      title: Verdict
      type: object
    VerdictPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/VerdictSummary'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque cursor for the next page; null on the last page.
          title: Next Cursor
      required:
      - items
      - next_cursor
      title: VerdictPage
      type: object
    VerdictSummary:
      description: One row of the operator history. No raw input and no personal data.
      properties:
        agent:
          $ref: '#/components/schemas/AgentActivity'
        channel:
          anyOf:
          - enum:
            - web
            - extension
            - api
            - mcp
            - voice
            - hunt
            type: string
          - type: 'null'
          description: Which client asked for the check; null when it did not say.
          title: Channel
        created_at:
          title: Created At
          type: string
        degraded:
          title: Degraded
          type: boolean
        degraded_reasons:
          items:
            type: string
          title: Degraded Reasons
          type: array
        display:
          anyOf:
          - type: string
          - type: 'null'
          description: Defanged host for links (no userinfo, path or query); null for messages, emails
            and images.
          title: Display
        input_type:
          enum:
          - url
          - message
          - email
          - image
          title: Input Type
          type: string
        model_route:
          enum:
          - cloud
          - local
          - none
          title: Model Route
          type: string
        risk_score:
          maximum: 100.0
          minimum: 0.0
          title: Risk Score
          type: integer
        source:
          enum:
          - live
          - replay
          - synthetic
          - fixture
          title: Source
          type: string
        tier_reached:
          enum:
          - T0
          - T1
          - T2
          - T3
          title: Tier Reached
          type: string
        verdict:
          enum:
          - dangerous
          - suspicious
          - no_warning_signs
          title: Verdict
          type: string
        verdict_id:
          title: Verdict Id
          type: string
      required:
      - verdict_id
      - created_at
      - input_type
      - display
      - verdict
      - risk_score
      - degraded
      - degraded_reasons
      - tier_reached
      - model_route
      - source
      - agent
      title: VerdictSummary
      type: object
    VoiceUtterance:
      additionalProperties: false
      properties:
        answer_id:
          anyOf:
          - pattern: ^faq\.[a-z_]+$
            type: string
          - type: 'null'
          title: Answer Id
        command:
          maxLength: 300
          title: Command
          type: string
        duration_ms:
          minimum: 0.0
          title: Duration Ms
          type: integer
        intent:
          enum:
          - check_clipboard
          - check_text
          - help
          - stop
          - faq
          - off_topic
          - none
          title: Intent
          type: string
        lang:
          enum:
          - ar
          - en
          - other
          title: Lang
          type: string
        model:
          title: Model
          type: string
        transcript:
          maxLength: 300
          title: Transcript
          type: string
        wake:
          title: Wake
          type: boolean
      required:
      - transcript
      - lang
      - wake
      - intent
      - command
      - answer_id
      - duration_ms
      - model
      title: VoiceUtterance
      type: object
    falcon_core__contracts__agent_trace__TraceStep:
      additionalProperties: false
      properties:
        budget:
          $ref: '#/components/schemas/TraceBudget'
        duration_ms:
          minimum: 0.0
          title: Duration Ms
          type: integer
        error_code:
          anyOf:
          - pattern: ^[a-z0-9_]{1,40}$
            type: string
          - type: 'null'
          title: Error Code
        generated_by:
          anyOf:
          - enum:
            - llm
            - template
            - rule
            type: string
          - type: 'null'
          title: Generated By
        llm:
          anyOf:
          - $ref: '#/components/schemas/TraceLlm'
          - type: 'null'
        node:
          enum:
          - enrich
          - compare
          - assess
          - summarise
          - propose
          - act
          title: Node
          type: string
        seq:
          minimum: 1.0
          title: Seq
          type: integer
        started_at:
          title: Started At
          type: string
        status:
          enum:
          - running
          - interrupted
          - completed
          - failed
          title: Status
          type: string
        summary_ar:
          maxLength: 300
          title: Summary Ar
          type: string
        summary_en:
          maxLength: 300
          title: Summary En
          type: string
        tools:
          items:
            $ref: '#/components/schemas/TraceTool'
          title: Tools
          type: array
      required:
      - seq
      - node
      - started_at
      - duration_ms
      - status
      - summary_en
      - summary_ar
      - tools
      - llm
      - budget
      - error_code
      title: TraceStep
      type: object
    falcon_core__contracts__verdict__TraceStep:
      additionalProperties: false
      properties:
        evidence_added:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Evidence Added
        kind:
          enum:
          - tier
          - tool
          - llm
          - rule
          title: Kind
          type: string
        ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ms
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        step:
          title: Step
          type: integer
        summary:
          maxLength: 240
          title: Summary
          type: string
      required:
      - step
      - kind
      - summary
      title: TraceStep
      type: object
  securitySchemes:
    APIKeyHeader:
      description: 'Integration key (scopes: check, read, operator, intel, hunt). `Authorization: Bearer
        <key>` also ok.'
      in: header
      name: X-API-Key
      type: apiKey
info:
  description: REST v1 for Falcon Lens. Verdicts follow contracts/verdict.schema.json. Errors are RFC
    9457 problem+json. Submitted content is never echoed back.
  title: Falcon Lens API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/admin/hunt:
    get:
      description: 'Hunt mode operator view (operator scope): all statuses, prescore (queue priority only),
        quotas.'
      operationId: get_admin_hunt_v1_admin_hunt_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuntAdmin'
          description: Successful Response
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: Get Admin Hunt
      tags:
      - admin
    put:
      description: Pause or resume hunting at runtime (operator scope, audit-logged). Takes effect before
        the next request.
      operationId: put_admin_hunt_v1_admin_hunt_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HuntAdminIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuntAdmin'
          description: Successful Response
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: Put Admin Hunt
      tags:
      - admin
  /v1/admin/llm-route:
    get:
      description: Current language-model route (operator scope).
      operationId: get_llm_route_v1_admin_llm_route_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmRoute'
          description: Successful Response
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: Get Llm Route
      tags:
      - admin
    put:
      description: Switch the route at runtime (operator scope, audit-logged). Takes effect in a few seconds.
      operationId: put_llm_route_v1_admin_llm_route_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmRouteIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmRoute'
          description: Successful Response
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: Put Llm Route
      tags:
      - admin
  /v1/campaigns:
    get:
      description: Campaign cards (incidents of type campaign / kit_reuse), newest first.
      operationId: list_campaigns_v1_campaigns_get
      parameters:
      - description: Opaque cursor from `next_cursor`.
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - maxLength: 512
            type: string
          - type: 'null'
          description: Opaque cursor from `next_cursor`.
          title: Cursor
      - description: Page size.
        in: query
        name: limit
        required: false
        schema:
          default: 25
          description: Page size.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
          description: Successful Response
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: List Campaigns
      tags:
      - campaigns
  /v1/campaigns/stream:
    get:
      description: 'SSE: `event: campaign`, data = one campaign object (contracts/campaign.schema.json).'
      operationId: campaigns_stream_v1_campaigns_stream_get
      parameters:
      - in: header
        name: last-event-id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          content:
            text/event-stream:
              itemSchema:
                properties:
                  data:
                    type: string
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    minimum: 0
                    type: integer
                type: object
          description: Successful Response
        '413':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: Campaigns Stream
      tags:
      - campaigns
  /v1/check/email:
    post:
      operationId: check_email_v1_check_email_post
      parameters:
      - description: Block up to N seconds (capped at 8) for the best verdict so far.
        in: query
        name: wait
        required: false
        schema:
          default: 0
          description: Block up to N seconds (capped at 8) for the best verdict so far.
          minimum: 0
          title: Wait
          type: number
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_check_email_v1_check_email_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verdict'
          description: Final verdict (cache hit or ?wait completed).
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
          description: Accepted; or best partial verdict when ?wait.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Payload too large
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Unsupported media type
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Invalid request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Rate limited
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Dependency unavailable
      security:
      - APIKeyHeader: []
      summary: Check Email
      tags:
      - check
  /v1/check/image:
    post:
      operationId: check_image_v1_check_image_post
      parameters:
      - description: Block up to N seconds (capped at 8) for the best verdict so far.
        in: query
        name: wait
        required: false
        schema:
          default: 0
          description: Block up to N seconds (capped at 8) for the best verdict so far.
          minimum: 0
          title: Wait
          type: number
