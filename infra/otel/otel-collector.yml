receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Probe and scrape spans (FastAPI emits them natively) would bury the real traces.
  filter/probes:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^(GET|HEAD) /(healthz|readyz|metrics).*")'
  # Privacy: drop EVERY span event (exception events carry messages/stack traces).
  filter/events:
    error_mode: ignore
    traces:
      spanevent:
        - 'true'
  # Privacy: ALLOW-list. Prompts, model output, tool arguments/results, url.* and anything an SDK
  # adds later never reach the trace store. The key list is pinned to
  # falcon_core.telemetry.tracing.COLLECTOR_ALLOWED_ATTRIBUTES by a test.
  transform/allowlist:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["deployment.environment", "service.name", "service.version"])
      - context: scope
        statements:
          - keep_keys(attributes, [])
      - context: span
        statements:
          - keep_keys(attributes, ["error.type", "fl.input_type", "fl.interrupted", "fl.latency_ms", "fl.llm.cost_usd", "fl.llm.role", "fl.llm.route", "fl.model_route", "fl.node", "fl.source", "fl.stop_reason", "fl.tier", "fl.tier_reached", "fl.tool", "fl.tool.status", "fl.tool_calls", "fl.verdict", "gen_ai.operation.name", "gen_ai.provider.name", "gen_ai.request.max_tokens", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.system", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "http.request.method", "http.response.status_code", "http.route", "incident_id", "llm.model_name", "llm.provider", "llm.system", "llm.token_count.completion", "llm.token_count.prompt", "llm.token_count.prompt_details.cache_read", "llm.token_count.prompt_details.cache_write", "llm.token_count.total", "openinference.span.kind", "verdict_id"])
          - set(status.message, "")
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    # Phoenix v22 has auth on: ingestion needs `authorization: Bearer <key>` (lowercase header).
    headers:
      authorization: "Bearer ${env:PHOENIX_INGEST_KEY}"
    tls:
      insecure: true
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/probes, filter/events, transform/allowlist, batch]
      exporters: [otlphttp/phoenix]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
