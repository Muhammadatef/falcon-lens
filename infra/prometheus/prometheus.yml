global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Python services expose /metrics (falcon_core.service). Labels are for dashboards.
  - job_name: falcon-services
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }
      - targets: ["worker:8000"]
        labels: { service: worker }
      - targets: ["sentinel:8000"]
        labels: { service: sentinel }
      - targets: ["mcp:8000"]
        labels: { service: mcp }

  # The sandbox is not reachable from Prometheus (isolation): the worker relays its metrics.
  - job_name: sandbox-via-worker
    metrics_path: /metrics/sandbox
    static_configs:
      - targets: ["worker:8000"]
        labels: { service: sandbox }

  - job_name: egress-proxy
    static_configs:
      - targets: ["egress-proxy:8081"]
        labels: { service: egress }

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]
        labels: { service: otel-collector }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { service: loki }

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { service: alertmanager }

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: { service: grafana }
