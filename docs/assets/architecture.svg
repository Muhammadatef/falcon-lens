<text x="177.75" y="1046" class="b" text-anchor="middle">REST API + SSE</text>
<text x="177.75" y="1064" class="c m" text-anchor="middle">scoped keys · rate limits</text>
<rect class="card" x="329.5" y="996" width="259.5" height="82" rx="12"/>
<text x="459.25" y="1026" class="h" text-anchor="middle" direction="rtl">ناقل الأحداث</text>
<text x="459.25" y="1046" class="b" text-anchor="middle">event bus</text>
<text x="459.25" y="1064" class="c m" text-anchor="middle">Redis Streams</text>
<rect class="card" x="611.0" y="996" width="259.5" height="82" rx="12"/>
<text x="740.75" y="1026" class="h" text-anchor="middle" direction="rtl">قاعدة البيانات</text>
<text x="740.75" y="1046" class="b" text-anchor="middle">Postgres + pgvector</text>
<text x="740.75" y="1064" class="c m" text-anchor="middle">verdicts · incidents · audit log</text>
<rect class="card" x="892.5" y="996" width="259.5" height="82" rx="12"/>
<text x="1022.25" y="1026" class="h" text-anchor="middle" direction="rtl">البيئة المعزولة ووسيط الخروج</text>
<text x="1022.25" y="1046" class="b" text-anchor="middle">sandbox + egress proxy</text>
<text x="1022.25" y="1064" class="c m" text-anchor="middle">isolated network</text>
<rect class="ext" x="48.0" y="1100" width="353.3" height="82" rx="12"/>
<text x="224.65" y="1130" class="h" text-anchor="middle" direction="rtl">جاهز للربط، غير مربوط</text>
<text x="224.65" y="1150" class="b" text-anchor="middle">MCP · STIX · webhooks</text>
<text x="224.65" y="1168" class="c m" text-anchor="middle">ready to connect, not connected</text>
<rect class="card" x="423.3" y="1100" width="353.3" height="82" rx="12"/>
<text x="599.95" y="1130" class="h" text-anchor="middle" direction="rtl">المراقبة</text>
<text x="599.95" y="1150" class="b" text-anchor="middle">observability</text>
<text x="599.95" y="1168" class="c m" text-anchor="middle">Prometheus · Grafana · Alertmanager · Phoenix</text>
<rect class="card" x="798.6" y="1100" width="353.3" height="82" rx="12"/>
<text x="975.25" y="1130" class="h" text-anchor="middle" direction="rtl">الصفحات العامة</text>
<text x="975.25" y="1150" class="b" text-anchor="middle">public pages</text>
<text x="975.25" y="1168" class="c m" text-anchor="middle">check · history · traces · campaigns · results</text>
<text x="600.0" y="1232" class="c" text-anchor="middle">Shipped code only; build status is in the README. Independent prototype: ready to connect, not connected to any authority.</text>
</svg>
