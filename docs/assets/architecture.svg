<text x="132" y="900" class="b" text-anchor="start">The verdict returns as a live stream; each finished check is an event on the bus</text>
<text x="132" y="919" class="b" text-anchor="end" direction="rtl">الحكم يعود ببث مباشر، وحدث لكل فحص منتهٍ على ناقل الأحداث</text>
<rect class="zone platform" x="24" y="934" width="1152" height="270" rx="18"/>
