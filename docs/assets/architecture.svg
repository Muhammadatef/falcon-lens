<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" width="1200" height="1250" role="img" aria-labelledby="t d">
<title id="t">Falcon Lens architecture in three layers</title>
<desc id="d">Three stacked layers. Top, the voice assistant layer: browser microphone with end-of-speech detection, the web route, the API, local speech to text, the wake phrase and language, the intent step (fixed rules, then a local embedding match for prepared questions, else a redirect), the action, pre-generated narration clips, and the trace in History and Grafana. Middle, the two AI agents layer: Baseer, the Investigator, runs tiers T0 to T3 and a deterministic arbiter sets the verdict, with a selectable model route; Dir', the Sentinel, listens to every check, correlates, lets rules decide incidents, runs a LangGraph triage and holds outside drafts for human approval. Bottom, the platform layer: the REST and SSE API, the event bus, Postgres with pgvector, the isolated sandbox with the egress proxy, MCP, STIX and webhooks that are ready to connect and not connected, observability, and the public pages. Arrows show a request flowing down: the voice layer calls the same public check API, and the agents return the verdict as a stream and publish an event for each finished check.</desc>
