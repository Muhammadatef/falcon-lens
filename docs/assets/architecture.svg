<text x="1022.25" y="312" class="h" text-anchor="middle" direction="rtl">الأثر</text>
<text x="1022.25" y="332" class="b" text-anchor="middle">trace</text>
<text x="1022.25" y="350" class="c m" text-anchor="middle">History voice badge · Grafana row</text>
<path class="w" d="M872.5 323.0H889.5" marker-end="url(#ah)"/>
<path class="w" d="M1050.3999999999999 236V259H177.75V279" marker-end="url(#ah)"/>
<text x="600.0" y="394" class="c" text-anchor="middle">Audio stays in memory and is never stored. No cloud speech service. No generative model writes an answer.</text>
<path id="l1" class="w" d="M110 410V458" marker-end="url(#ah)"/>
<circle class="dot" r="5"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0s"><mpath href="#l1"/></animateMotion></circle>
<text x="132" y="432" class="b" text-anchor="start">The same public check API as the Check page</text>
<text x="132" y="451" class="b" text-anchor="end" direction="rtl">واجهة الفحص العامة نفسها التي تستخدمها صفحة الفحص</text>
<rect class="zone agents" x="24" y="466" width="1152" height="412" rx="18"/>
<rect class="bar agents" x="24" y="466" width="6" height="412" rx="3"/>
<circle class="lb agents" cx="62" cy="500" r="15"/>
<text x="88" y="496" class="lt" text-anchor="start">THE TWO AI AGENTS LAYER</text>
<text x="1152" y="500" class="la" text-anchor="start" direction="rtl">طبقة الوكيلين الذكيين</text>
<rect class="grp inv" x="48" y="526" width="540" height="336" rx="14"/>
<text x="570" y="556" class="gh" text-anchor="start" direction="rtl">«بصير»، المحقّق</text>
<text x="66" y="554" class="b" text-anchor="start">Baseer, the Investigator: judges one input</text>
<rect class="card" x="64" y="572" width="508" height="40" rx="10"/>
<text x="82" y="597" class="h m" text-anchor="start">T0</text>
<text x="124" y="597" class="b" text-anchor="start">known reports, cache</text>
<text x="556" y="598" class="h" text-anchor="start" direction="rtl">البلاغات المعروفة</text>
<rect class="card" x="64" y="620" width="508" height="40" rx="10"/>
