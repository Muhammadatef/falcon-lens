<text x="177.75" y="312" class="h" text-anchor="middle" direction="rtl">فهم الطلب</text>
<text x="177.75" y="332" class="b" text-anchor="middle">intent</text>
<text x="177.75" y="350" class="c m" text-anchor="middle">rules · local embedding · redirect</text>
<rect class="card" x="329.5" y="282" width="259.5" height="82" rx="12"/>
<text x="459.25" y="312" class="h" text-anchor="middle" direction="rtl">الإجراء</text>
<text x="459.25" y="332" class="b" text-anchor="middle">action</text>
<text x="459.25" y="350" class="c m" text-anchor="middle">check · answer · help · stop</text>
<path class="w" d="M309.5 323.0H326.5" marker-end="url(#ah)"/>
<rect class="card" x="611.0" y="282" width="259.5" height="82" rx="12"/>
<text x="740.75" y="312" class="h" text-anchor="middle" direction="rtl">الرواية الصوتية</text>
<text x="740.75" y="332" class="b" text-anchor="middle">narration, pre-generated clips</text>
<text x="740.75" y="350" class="c m" text-anchor="middle">Polly Zayd (AR) · Kokoro (EN)</text>
<path class="w" d="M591.0 323.0H608.0" marker-end="url(#ah)"/>
