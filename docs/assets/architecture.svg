<text x="1050.3999999999999" y="184" class="h" text-anchor="middle" direction="rtl">عبارة التنبيه واللغة</text>
<text x="1050.3999999999999" y="204" class="b" text-anchor="middle">wake phrase + language</text>
<text x="1050.3999999999999" y="222" class="c m" text-anchor="middle">Hey Falcon</text>
<path class="w" d="M928.8 195.0H945.8" marker-end="url(#ah)"/>
