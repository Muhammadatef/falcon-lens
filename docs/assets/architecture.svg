<text x="600.0" y="204" class="b" text-anchor="middle">API</text>
<text x="600.0" y="222" class="c m" text-anchor="middle">/v1/voice/utterance</text>
<path class="w" d="M478.4 195.0H495.4" marker-end="url(#ah)"/>
