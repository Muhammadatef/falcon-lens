<text x="40" y="70" class="t2" text-anchor="start">The architecture in three layers: a request flows from the top to the bottom.</text>
<text x="1160" y="44" class="t1" text-anchor="start" direction="rtl">البنية في ثلاث طبقات</text>
<rect class="zone voice" x="24" y="92" width="1152" height="318" rx="18"/>
