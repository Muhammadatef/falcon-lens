<text x="124" y="645" class="b" text-anchor="start">address + domain model</text>
<text x="556" y="646" class="h" text-anchor="start" direction="rtl">العنوان والنطاق</text>
<path class="w" d="M318.0 612V619"/>
<rect class="card" x="64" y="668" width="508" height="40" rx="10"/>
<text x="82" y="693" class="h m" text-anchor="start">T2</text>
<text x="124" y="693" class="b" text-anchor="start">isolated browser, brand check</text>
<text x="556" y="694" class="h" text-anchor="start" direction="rtl">المتصفح المعزول</text>
<path class="w" d="M318.0 660V667"/>
<rect class="card" x="64" y="716" width="508" height="40" rx="10"/>
<text x="82" y="741" class="h m" text-anchor="start">T3</text>
<text x="124" y="741" class="b" text-anchor="start">AI second look, bounded tools</text>
<text x="556" y="742" class="h" text-anchor="start" direction="rtl">نظرة الذكاء الاصطناعي</text>
<path class="w" d="M318.0 708V715"/>
<rect class="card" x="64" y="764" width="508" height="40" rx="10"/>
<text x="82" y="789" class="b" text-anchor="start">deterministic arbiter sets the verdict</text>
<text x="556" y="790" class="h" text-anchor="start" direction="rtl">المحكّم الحتمي</text>
<path class="w" d="M318.0 756V763"/>
<text x="318.0" y="848" class="c" text-anchor="middle">A model is called only for the uncertain band. Fixed code sets the verdict.</text>
<rect class="grp sen" x="612" y="526" width="540" height="336" rx="14"/>
<text x="1134" y="556" class="gh" text-anchor="start" direction="rtl">«درع»، الحارس</text>
<text x="630" y="554" class="b" text-anchor="start">Dir&#x27;, the Sentinel: watches every check</text>
<rect class="card" x="628" y="572" width="508" height="40" rx="10"/>
<text x="646" y="597" class="b" text-anchor="start">listens to every check</text>
<text x="1120" y="598" class="h" text-anchor="start" direction="rtl">يستمع لكل فحص</text>
<rect class="card" x="628" y="620" width="508" height="40" rx="10"/>
<text x="646" y="645" class="b" text-anchor="start">correlates similar checks</text>
<text x="1120" y="646" class="h" text-anchor="start" direction="rtl">يربط المتشابه</text>
<path class="w" d="M882.0 612V619"/>
<rect class="card" x="628" y="668" width="508" height="40" rx="10"/>
<text x="646" y="693" class="b" text-anchor="start">rules decide the incident</text>
<text x="1120" y="694" class="h" text-anchor="start" direction="rtl">القواعد تقرر الحادثة</text>
<path class="w" d="M882.0 660V667"/>
<rect class="card" x="628" y="716" width="508" height="40" rx="10"/>
<text x="646" y="741" class="b" text-anchor="start">LangGraph triage, checkpointed</text>
<text x="1120" y="742" class="h" text-anchor="start" direction="rtl">فرز بمخطط LangGraph</text>
<path class="w" d="M882.0 708V715"/>
<rect class="gate" x="628" y="764" width="508" height="40" rx="10"/>
<text x="646" y="789" class="b" text-anchor="start">outside drafts wait for a person</text>
<text x="1120" y="790" class="h" text-anchor="start" direction="rtl">موافقة بشرية</text>
<path class="w" d="M882.0 756V763"/>
<text x="882.0" y="848" class="c" text-anchor="middle">Rules decide incidents. The model only summarises and proposes.</text>
<text x="318.0" y="830" class="c" text-anchor="middle">Model route, chosen by an operator: Claude with local Inkling fallback, or local Inkling or Qwen</text>
<path class="w" d="M591 696H609" marker-end="url(#ah)"/>
<path id="l2" class="w" d="M110 878V926" marker-end="url(#ah)"/>
