<text x="825.1999999999999" y="184" class="h" text-anchor="middle" direction="rtl">تحويل الكلام إلى نص محلياً</text>
<text x="825.1999999999999" y="204" class="b" text-anchor="middle">speech to text, local</text>
<text x="825.1999999999999" y="222" class="c m" text-anchor="middle">mlx-whisper · faster-whisper</text>
<path class="w" d="M703.5999999999999 195.0H720.5999999999999" marker-end="url(#ah)"/>
