[project]
name = "falcon-mcp-service"
version = "0.1.0"
description = "Falcon Lens MCP server (health only for now)"
requires-python = ">=3.12,<3.13"
dependencies = ["falcon-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_mcp"]
