[project]
name = "falcon-mcp-service"
version = "0.1.0"
description = "Falcon Lens MCP server (streamable HTTP, bearer auth)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "falcon-core",
    "httpx>=0.28",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_mcp"]
