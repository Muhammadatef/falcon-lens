[project]
name = "falcon-worker"
version = "0.1.0"
description = "Falcon Lens cascade worker"
requires-python = ">=3.12,<3.13"
dependencies = ["falcon-core", "asyncpg>=0.30,<0.33", "redis>=8.1,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_worker"]
