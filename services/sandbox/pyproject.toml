[project]
name = "falcon-sandbox"
version = "0.1.0"
description = "Falcon Lens sandbox browser service (features only)"
requires-python = ">=3.12,<3.13"
dependencies = ["falcon-core", "playwright==1.65.2", "pillow>=11.0", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_sandbox"]
