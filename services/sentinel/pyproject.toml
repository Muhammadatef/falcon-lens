[project]
name = "falcon-sentinel"
version = "0.1.0"
license = "Apache-2.0"
description = "Falcon Lens Sentinel (consumer, correlation, rules, LangGraph triage)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "falcon-core",
  "redis>=5.2",
  "pyyaml>=6",
  "python-ulid>=3",
  "jsonschema>=4.23",
  "langgraph==1.2.24",
  "langgraph-checkpoint-postgres==3.2.1",
  "langchain-core==1.8.4",
  "psycopg[binary,pool]>=3.3",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_sentinel", "sentinel_core"]
