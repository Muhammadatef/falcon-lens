[project]
name = "falcon-sentinel"
version = "0.1.0"
description = "Falcon Lens Sentinel (event consumer stub)"
requires-python = ">=3.12,<3.13"
dependencies = ["falcon-core", "redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_sentinel"]
