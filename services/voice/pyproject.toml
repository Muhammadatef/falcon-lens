[project]
name = "falcon-voice"
version = "0.1.0"
license = "Apache-2.0"
description = "Falcon Lens voice STT, container fallback (faster-whisper, CPU). Audio stays in memory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "falcon-core",
    "faster-whisper==1.2.1",
    # faster-whisper 1.2.1 passes `metadata_errors` to av.open, which PyAV 19 no longer accepts
    "av>=15,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_voice"]
