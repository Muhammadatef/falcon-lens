# Falcon Demo Bank fixtures. INTERNAL NETWORK ONLY (compose `sandbox` network, tools profile).
# Invented brand; every page carries a visible TEST FIXTURE banner; forms post nowhere real.
# Hosts are reached through compose network aliases (*.test never resolves outside Docker).

access_log /dev/stdout;

# cloaked fixture: phish for Android + Arabic, benign otherwise
map "$http_user_agent|$http_accept_language" $cloak_variant {
    default benign;
    "~*android.*\|ar" phish;
}

# 1) official site (the brand owner), also served at /official/ on the plain `fixtures` host
server {
    listen 80;
    server_name falcon-demo-bank.test;
    root /srv/official;
    location / { try_files $uri $uri/ =404; }
    location = /login { try_files /login.html =404; }
    include /etc/nginx/conf.d/redirs.inc;
}

# 2) lookalike phish: cred form -> fake bot API, assets hot-linked from the official fixture
server {
    listen 80;
    server_name falcon-demo-bank-secure.test falcon-demo-bank-login.test;
    root /srv/phish;
    location = /login { try_files /login.html =404; }
    location = / { return 302 /login; }
}

# 3) fake bot-API host: swallows everything and answers 404
server {
    listen 80;
    server_name falcon-bot-relay.test;
    location / { default_type text/plain; return 404 "not found (test fixture)\n"; }
}

# 4) cloaked variant
server {
    listen 80;
    server_name falcon-demo-bank-cloak.test;
    root /srv/cloaked;
    add_header Vary "User-Agent, Accept-Language" always;
    location / { rewrite ^ /$cloak_variant.html break; }
}

# 5) page with injected instructions (visible, hidden, alt text, Arabic, base64) for the redteam
server {
    listen 80;
    server_name falcon-demo-bank-injection.test;
    root /srv/injection;
    location / { try_files $uri $uri/index.html =404; }
}

# 6) plain `fixtures` host (smoke tests): /official/ and /phish/
server {
    listen 80 default_server;
    server_name fixtures;
    location = / { root /srv; try_files /index.html =404; }
    location /official/ { alias /srv/official/; index index.html; }
    location /phish/ { alias /srv/phish/; index login.html; }
    location /assets/ { alias /srv/official/assets/; }
    location = /phish { return 302 /phish/; }
    location = /official { return 302 /official/; }
}
