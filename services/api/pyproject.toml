[project]
name = "falcon-api"
version = "0.1.0"
license = "Apache-2.0"
description = "Falcon Lens REST API v1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "falcon-core",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "python-ulid>=3.0",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_api"]
