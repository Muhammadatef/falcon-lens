         source_url: https://www.dubaicustoms.gov.ae/en/Pages/default.aspx, retrieved_at: 2026-11-25}
    logo_ref: null
    favicon_hash: null
    unverified_notes: "The contact e-mail on the page uses dubaicustoms.ae; that domain was not read and is NOT listed. name_ar not confirmed on page."

  - brand_id: adnoc_distribution
