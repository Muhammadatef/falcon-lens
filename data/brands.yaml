# Falcon Lens brand registry: commonly impersonated UAE entities.
# Purpose: lets the domain/lexical signals test whether a URL claims or resembles a known brand
#   while not being on that brand's official domains.
# Domains are REGISTRABLE domains (eTLD+1 per the Public Suffix List), e.g. "adpolice.gov.ae";
#   subdomains (login., online., smartservices.) are covered by the registrable domain.
# Verification date: 2026-11-22 (retrieved_at). Each domain was seen on the entity's own page
#   (or on another official UAE government page that links to it) at source_url.
#   Domains that could not be verified are OMITTED and explained in unverified_notes.
# This file contains NO logos or images. logo_ref and favicon_hash are filled later by the
#   sandbox builder from data/private/.
# name_ar values marked in unverified_notes were not confirmed on the fetched page.
# This is a defensive allow-list; it implies no endorsement by, or integration with, any entity.
