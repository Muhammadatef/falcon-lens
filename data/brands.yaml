# Falcon Lens brand registry: commonly impersonated UAE entities.
# Purpose: lets the domain/lexical signals test whether a URL claims or resembles a known brand
#   while not being on that brand's official domains.
# Domains are REGISTRABLE domains (eTLD+1 per the Public Suffix List), e.g. "adpolice.gov.ae";
#   subdomains (login., online., smartservices.) are covered by the registrable domain.
# Verification date: 2026-11-22 (retrieved_at). Each domain was seen on the entity's own page
#   (or on another official UAE government page that links to it) at source_url.
#   Domains that could not be verified are OMITTED and explained in unverified_notes.
# This file contains NO logos or images. logo_ref and favicon_hash are filled later by the
#   sandbox builder from data/private/.
# name_ar values marked in unverified_notes were not confirmed on the fetched page.
# This is a defensive allow-list; it implies no endorsement by, or integration with, any entity.
#
# official_contacts (T-036, read 2026-11-24): customer-service numbers, each read on the entity's OWN page at
#   source_url. kind phone -> value in E.164 (+971...), local = the form shown on the page; kind short_code -> the
#   digits as shown (999, 101, 155). Used only by brand.unofficial_contact_number: a number that matches this list
#   emits nothing (caller ID can be spoofed, so a match is never trust). A brand without official_contacts never
#   produces that evidence. Numbers that could not be read on the entity's own page are OMITTED:
#   - adcb: adcb.com answered HTTP 403 to every fetch (bot protection); no number recorded.
#   - uae_pass: uaepass.ae renders no text to a fetcher; 600561111 is listed on the official ICP site
#     (icp.gov.ae/en/uae-pass/, federal government), accepted by L1 on 2026-11-24.
#   - dubai_police: dubaipolice.gov.ae is a script-only app; 901 is cited by news and mediaoffice.ae only. Omitted.
#   - etisalat_by_eand: only 101 was read (eand.ae support page); 800 101 for non-customers appears in search
#     snippets of an etisalat.ae page that now returns 404. Omitted.
#   - salik, itc_abu_dhabi_darb, addc, dewa, sewa, cbuae, moi_uae, emirates_islamic: not researched in T-036.
#   Abu Dhabi Police numbers are listed because scammers impersonate it; this is NOT a partnership.
