    keywords_ar: [شرطة ابوظبي, شرطة أبوظبي, مخالفة, مخالفات, بلاغ, قضية, أمان]
    official_contacts:
      - {kind: short_code, value: "999", local: "999", label_en: "Emergency number", label_ar: "رقم الطوارئ",
         source_url: https://www.adpolice.gov.ae/en/, retrieved_at: 2026-11-24}
      - {kind: phone, value: "+9718002626", local: "800 2626", label_en: "Aman service", label_ar: "خدمة أمان",
         source_url: https://www.adpolice.gov.ae/en/, retrieved_at: 2026-11-24}
      - {kind: short_code, value: "2828", local: "2828", label_en: "Aman service short number", label_ar: "الرقم المختصر لخدمة أمان",
