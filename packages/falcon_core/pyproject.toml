[project]
name = "falcon-core"
version = "0.1.0"
description = "Shared contracts, service helper and config for Falcon Lens"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.165,<0.166",
  "uvicorn>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.7",
  "prometheus-client>=0.21",
  "httpx>=0.28.1,<0.29",  # security/http.py swaps the private AsyncHTTPTransport._pool (pinned by a test)
  "httpcore>=1,<2",
  "tldextract>=5",
  "redis>=5.2",
  "pyyaml>=6",
  "pillow>=11",
  "zxing-cpp>=2.3",
  "python-ulid>=3",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon_core"]
