# English templates. Fallback when the LLM responder is off or its output fails the verifier.
# Keep every line short (phone screen). Never use the word for "s-a-f-e" (tests enforce this).
lang: en

verdict:
  dangerous: "Dangerous"
  suspicious: "Suspicious"
  no_warning_signs: "No warning signs found"

degraded: "We couldn't complete every check."

hard_rules:
  H1: "This page pretends to be a known organisation and asks for your details, but it is not their official site."
  H2: "This link was recently listed as a known scam site."
  H3: "This is a registered official website of the organisation."
  H4: "This page sends what you type to an outside messaging account."
  H5: "This message contains a link we found dangerous."
  H5s: "This message contains a link we found suspicious."
  H6: "This message asks for a code or an app install while posing as an official body or bank."
  RF1: "This message asks for money while posing as an official body, a bank or a service."
  RF2: "This message claims a problem with your account and asks you to install a remote-access app."
  RF3: "This message asks for a code, PIN or card details and pushes you to act."

reasons:
  rep.feed_hit: "This link is on a list of known scam sites."
  url.homograph: "The site name copies a known name using look-alike letters."
  url.typosquat: "The site name is one or two letters off a known name."
  url.combosquat: "The site name adds words like 'pay' or 'track' to a known name."
  url.brand_in_subdomain_or_path: "A known name appears in the link, but the site is not theirs."
  url.userinfo_trick: "The link is written to hide the real site address."
  url.bidi_or_zero_width: "The link has hidden characters that change how it looks."
  url.raw_ip_host: "The link uses a number instead of a site name."
  url.free_host_or_tunnel: "The site is on a free hosting service anyone can use."
  url.open_redirect_abuse: "The link goes through a known site, then sends you somewhere else."
  domain.age.new: "This website was created only days ago."
  domain.age.old: "This website has been registered for more than ten years."
  domain.cert_age: "The site's security certificate was issued only days ago."
  page.cred_form: "The page asks for sensitive details like a password, card number or code."
  page.cross_origin_post: "The page sends what you type to another server."
  page.hotlinked_brand_assets: "The page loads logos and images from a known organisation's site."
  page.cloaking: "The page shows different content on a phone than on a computer."
  page.js_obfuscation: "The page uses hidden code."
  page.anti_inspection: "The page tries to block inspection."
  visual.favicon_match_brand: "The page icon looks like a known organisation's icon."
  brand.claimed_not_owned: "The page claims to be a known organisation, but the site is not theirs."
  registry.verified_official: "This is a registered official website of the organisation."
  message.script_match: "This message is close to known scam messages."
  message.scam_intent: "The message asks for a code, money or access the way scam messages do."
  message.link_verdict: "This message contains a link we found dangerous."
  message.rule.urgency: "The message pushes you to act right now."
  message.rule.secrecy: "The message asks you not to tell anyone."
  message.rule.otp_request: "The message asks for your verification code. Official bodies never ask for it in a message or call."
  message.rule.remote_access: "The message asks you to install an app that controls your phone."
  message.rule.payment: "The message asks you to pay money."
  message.rule.authority: "The message poses as an official body or a bank."
  message.rule.prize: "The message promises a prize or a win."
  message.rule.job: "The message offers easy work for big pay."
  message.rule.investment: "The message promises quick investment profits."
  message.rule.delivery_fee: "The message asks for a delivery fee for a parcel."
  message.rule.fine: "The message mentions a fine you must pay."
  email.auth_fail: "The email failed sender checks (SPF, DKIM and DMARC)."
  email.display_name_impersonation: "The sender name copies a known organisation, but the address is not theirs."
  email.reply_to_mismatch: "Replies go to a different address than the sender."
  email.limit_exceeded: "The email is unusually large or nested, so only part of it was read."
  message.limit_exceeded: "The message is unusually long, so only part of it was read."
  message.data_uri_active: "An inline data: address carries a form or script."
  email.link_text_mismatch: "A link shows one address but goes to another."
  email.link_verdict: "This email contains a link we found dangerous."
  url.classifier: "The address pattern looks like known scam links."
  url.data_uri: "The link holds a hidden page instead of a real site address."
  message.brand_mention: "The message names a known organisation."
  message.brand_url_mismatch: "The message names a known organisation, but its link goes to another site."
  brand.unofficial_contact_number: "The message gives a phone number that is not on the organisation's official list."
  email.attachment: "The email has an attachment that can run programs on your device."
  injection.instruction_like_text: "The content has hidden text that tries to trick checking tools."
  injection.tool_provenance: "The content tried to steer our check toward a different address."

actions:
  dangerous:
    now:
      - "Do not open the link or type anything into it."
      - "Never share a code or password with anyone."
      - "Delete the message and block the sender."
    if_already_acted:
      - "If you entered card details, call your bank now on the number on your card."
      - "Change your password from the official app or site."
      - "If you installed an app they asked for, delete it and turn off the internet."
  suspicious:
    now:
      - "Do not type any details on this page."
      - "Contact the organisation yourself through its official app or number."
      - "Don't rush. Scammers use pressure."
    if_already_acted:
      - "If you entered card details, call your bank now on the number on your card."
      - "Change your password from the official app or site."
  no_warning_signs:
    now:
      - "If you are asked for details, make sure you are on the official site."
    if_already_acted:
      - "If something felt wrong, call your bank or the organisation on its official number."

caution:
  - "No warning signs doesn't guarantee the site can be trusted."
  - "Never share your verification code (OTP) with anyone."
  - "If in doubt, contact the organisation on its official number."

report:
  with_channels: "Report it to Abu Dhabi Police through their official channels:"
  generic: "Report it through Abu Dhabi Police official channels."
