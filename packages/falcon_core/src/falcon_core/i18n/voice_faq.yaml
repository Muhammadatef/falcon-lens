ar_ae:
  "faq.otp": "البنك ما يطلب منك الرمز أبداً. لا تعطيه لأي أحد، حتى لو قال إنه من البنك."
  "faq.clicked_link": "لا تخاف، بس تصرّف بسرعة. لا تدخل أي بيانات، وكلّم بنكك، وغيّر أرقامك السرية."
  "faq.shared_card": "كلّم بنكك الحين على الرقم اللي ورا بطاقتك، وقل لهم يوقفون البطاقة. وبعدها بلّغ عن اللي صار."
  "faq.fake_police": "الشرطة ما تطلب فلوس بالتلفون. سكّر المكالمة، وبلّغ من القنوات الرسمية."
  "faq.parcel_fee": "رسالة رسوم التوصيل غالباً نصب. لا تضغط الرابط، واسأل شركة الشحن من تطبيقها الرسمي."
  "faq.prize": "ما تربح جايزة في سحب ما دخلته. لا ترد على الرسالة، ولا تدفع رسوم عشان تستلمها."
  "faq.investment": "أي عرض يوعدك بربح سريع ومضمون هو نصب غالباً. لا تحوّل فلوس، واسأل جهة مرخصة."
  "faq.fake_job": "الوظيفة الحقيقية ما تطلب منك فلوس قبل لا تبدأ. تأكد من الشركة من موقعها الرسمي."
  "faq.report": "بلّغ من القنوات الرسمية للجهات المختصة في الدولة. واحتفظ بالرسالة، ولا تحذفها."
  "faq.about": "أنا عدسة الصقر. أفحص الرسائل والروابط، وأقول لك إذا فيها علامات نصب، وأعطيك الأدلة."
  "faq.agents": "بصير يفحص الرسالة، ودرع يربط البلاغات المتشابهة. وما يطلع أي بلاغ أو تنبيه للجهات من غير موافقة شخص."
  "faq.data_stored": "صوتك ينعالج على سيرفرنا وما ينحفظ. من الفحص نحفظ بس نسخة معطّلة من الرابط والأدلة ونتيجة الفحص. ونص رسالتك ما ينحفظ، إلا إذا اخترت تبلّغ عنها."
  "faq.bank_link": "البنك ما يرسل لك رابط عشان تحدّث بياناتك. افتح تطبيق البنك بنفسك، أو كلّمه."
  "faq.friend_money": "إذا واحد من ربعك يطلب فلوس برسالة، كلّمه بالتلفون أول. يمكن حسابه انسرق."
  "faq.relative_urgent": "اتصال عن قريب محتاج فلوس بسرعة؟ سكّر، وكلّم قريبك على رقمه اللي تعرفه."
  "faq.remote_access": "لا تحمّل برنامج ولا تشارك شاشتك مع أحد يتصل فيك. هذي طريقة النصابين عشان يدخلون جهازك."
  "faq.qr_code": "لا تمسح رمز كيو آر من مصدر ما تعرفه. افتح الموقع بنفسك بدل ما تمسحه."
  "faq.online_shop": "الأسعار الرخيصة مرة ممكن تكون فخ. اشتر من مواقع تعرفها، وادفع بطريقة فيها حماية."
  "faq.sent_money": "كلّم بنكك فوراً، يمكن يقدرون يوقفون التحويل. وبلّغ من القنوات الرسمية، وكل ما أسرعت أحسن."
  "faq.shared_login": "غيّر رقمك السري الحين، وكلّم بنكك. وفعّل التحقق بخطوتين."
  "faq.spot_scam": "علامات النصب: استعجال، وتهديد، ورابط غريب، وطلب رمز أو فلوس. إذا شفت وحدة منها، وقّف."
  "faq.limits": "ما فيه نظام يكشف كل شي. أنا أعطيك علامات وأدلة، وإذا شكيت، كلّم بنكك."
  "offtopic.1": "هذا خارج شغلي. أنا أساعدك تكشف رسائل النصب. قل: يا صقر، افحص رسائلي."
  "offtopic.2": "ما أقدر أساعدك في هذا. أنا متخصص بالنصب والاحتيال. انسخ رسالتك، وقل: يا صقر، افحصها."
  "offtopic.3": "سؤالك حلو، بس مو من اختصاصي. اسألني عن رسائل النصب، أو قل: يا صقر، ساعدني."
  "ack.moment": "لحظة…"
en:
  "faq.otp": "Your bank never asks for your one-time code. Never share it with anyone, even if they say they are the bank."
  "faq.clicked_link": "Don't panic, but act fast. Don't enter any details, call your bank, and change your passcodes."
  "faq.shared_card": "Call your bank right now on the number on your card and ask them to block it. Then report what happened."
  "faq.fake_police": "The police never ask for money over the phone. Hang up, and report it through the official channels."
  "faq.parcel_fee": "A delivery fee message is often a scam. Don't tap the link, and ask the courier through its official app."
  "faq.prize": "You can't win a draw you never entered. Don't reply, and never pay a fee to collect a prize."
  "faq.investment": "An offer promising fast, guaranteed profit is usually a scam. Don't transfer money, and ask a licensed firm."
  "faq.fake_job": "A real job never asks you to pay before you start. Check the company on its official website."
  "faq.report": "Report it through the official channels of the authorities. Keep the message, and don't delete it."
  "faq.about": "I'm Falcon Lens. I check messages and links for scam signs, and show you the evidence."
  "faq.agents": "Baseer checks the message, Dir links similar reports. No alert or report goes out without a person's approval."
  "faq.data_stored": "Your voice is processed on our own server and isn't kept. From a check we keep only a defanged copy of the link, the evidence and the result. Your message text isn't kept unless you choose to report it."
  "faq.bank_link": "Your bank doesn't send links to update your details. Open your bank app yourself, or call it."
  "faq.friend_money": "If a friend asks for money by message, call them first. Their account may have been hacked."
  "faq.relative_urgent": "A call saying a relative urgently needs money? Hang up and call your relative on the number you know."
  "faq.remote_access": "Never install an app or share your screen for a caller. That's how scammers get into your phone."
  "faq.qr_code": "Don't scan a QR code from a source you don't know. Open the website yourself instead."
  "faq.online_shop": "Prices that look too good can be a trap. Buy from sites you know, and pay by a method with protection."
  "faq.sent_money": "Call your bank immediately, they may be able to stop the transfer. Then report it through the official channels."
  "faq.shared_login": "Change your passcode right now and call your bank. Then turn on two-step verification."
  "faq.spot_scam": "Scam signs: urgency, threats, a strange link, or a request for a code or money. If you see one, stop."
  "faq.limits": "No system catches everything. I show you signs and evidence, and if in doubt, call your bank."
  "offtopic.1": "That's outside what I do. I help you spot scam messages. Say: Hey Falcon, check my messages."
  "offtopic.2": "I can't help with that. I only handle scams and fraud. Copy your message and say: Hey Falcon, check it."
  "offtopic.3": "Good question, but not my area. Ask me about scam messages, or say: Hey Falcon, help me."
  "ack.moment": "One moment…"
